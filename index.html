<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- lang="en" alone doesn't stop Chrome's translate prompt: its language
         detector runs on page text, and a HUD has too few words to classify. -->
    <meta name="google" content="notranslate" />
    <title>Frost Rush GP — 3D Kart Racing</title>
    <meta
      name="description"
      content="A browser-based 3D arcade kart racer with drift mechanics, power-ups, AI opponents and a day/night cycle. Built with Three.js."
    />
    <!-- Inline SVG favicon: a checkered flag. Data URI means no extra request
         (and therefore no 404 when no favicon.ico is present). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2740'/%3E%3Cg fill='%23f4f4f4'%3E%3Crect x='7' y='7' width='6' height='6'/%3E%3Crect x='19' y='7' width='6' height='6'/%3E%3Crect x='13' y='13' width='6' height='6'/%3E%3Crect x='7' y='19' width='6' height='6'/%3E%3Crect x='19' y='19' width='6' height='6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="speed-lines"></div>

    <div id="hud">
      <div id="hud-fps" class="panel"><span id="fps-value">0</span> <span class="unit">fps</span></div>

      <div id="debug-panel" class="panel" hidden>
        <div class="debug-row"><span>FPS</span><span id="dbg-fps">0</span></div>
        <div class="debug-row"><span>Frame</span><span id="dbg-frame">0 ms</span></div>
        <div class="debug-row"><span>Draw calls</span><span id="dbg-calls">0</span></div>
        <div class="debug-row"><span>Triangles</span><span id="dbg-tris">0</span></div>
        <div class="debug-row"><span>Lights</span><span id="dbg-lights">0</span></div>
        <div class="debug-row"><span>Programs</span><span id="dbg-programs">0</span></div>
        <div class="debug-row"><span>Quality</span><span id="dbg-quality">medium</span></div>
        <div class="debug-row"><span>Bloom</span><span id="dbg-bloom">off</span></div>
      </div>

      <div id="hud-item" class="panel">
        <div id="item-icon">—</div>
        <div id="item-text">
          <div id="item-name">No item</div>
          <div id="item-hint">Shift / E to use</div>
        </div>
      </div>

      <div id="hud-topright">
        <div class="panel info-box">
          <span class="label">LAP</span>
          <span class="value" id="lap-value">1/3</span>
        </div>
        <div class="panel info-box">
          <span class="label">TIME</span>
          <span class="value" id="time-value">00:00.000</span>
        </div>
        <div class="panel info-box">
          <span class="label">BEST</span>
          <span class="value" id="best-value">--:--.---</span>
        </div>
        <div class="panel info-box">
          <span class="label">PTS</span>
          <span class="value" id="total-value">0</span>
        </div>
        <canvas id="minimap" class="panel" width="340" height="340"></canvas>
      </div>

      <div id="hud-position" class="panel">
        <span id="position-value">1</span><span id="position-suffix">st</span>
      </div>

      <div id="hud-speedo" class="panel">
        <svg viewBox="0 0 100 100">
          <circle class="speedo-bg" cx="50" cy="50" r="42" />
          <circle id="speedo-arc" cx="50" cy="50" r="42" />
        </svg>
        <div id="speedo-center">
          <span id="speed-value">0</span>
          <span class="unit">km/h</span>
        </div>
      </div>

      <div id="hud-drift" hidden>
        <div id="drift-label">DRIFT</div>
        <div id="drift-score">0</div>
        <div id="drift-combo" hidden>x1</div>
      </div>
      <div id="drift-bank" hidden>+0</div>

      <div id="countdown" hidden>3</div>

      <div id="endgame-timer" class="panel" hidden>
        <span class="endgame-label">Race ends in</span>
        <span id="endgame-seconds">20</span><span class="endgame-unit">s</span>
      </div>

      <div id="tod-indicator" class="panel" hidden><span id="tod-label">Day</span></div>

      <div id="input-method" class="panel" title="Active input method">
        <span id="input-method-icon">⌨</span>
      </div>

      <div id="toast" hidden></div>

      <div id="finish-overlay" hidden>
        <div id="finish-confetti"></div>
        <div id="finish-panel" class="panel">
          <div id="finish-title">FINISH</div>
          <div id="finish-position"></div>
          <div id="record-banner" hidden></div>
          <div class="finish-row"><span>Total time</span><span id="finish-time">--:--.---</span></div>
          <div class="finish-row"><span>Best lap</span><span id="finish-best">--:--.---</span></div>
          <div id="finish-standings"></div>
          <div id="finish-buttons">
            <button id="restart-button">Race again (R)</button>
            <button id="menu-button">Back to menu</button>
          </div>
        </div>
      </div>
    </div>

    <div id="menu-overlay" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
