<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Racing Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="hud">
      <div id="hud-speed"><span id="speed-value">0</span> <span class="unit">km/h</span></div>
      <div id="hud-fps"><span id="fps-value">0</span> <span class="unit">fps</span></div>
      <div id="hud-total"><span id="total-value">0</span> <span class="unit">pts</span></div>
      <div id="hud-drift" hidden>
        <div id="drift-label">DRIFT</div>
        <div id="drift-score">0</div>
        <div id="drift-combo" hidden>x1</div>
      </div>
      <div id="drift-bank" hidden>+0</div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
